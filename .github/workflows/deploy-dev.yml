name: Deploy Frontend Dev

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEV_SSH_KEY" > ~/.ssh/dev.pem
          chmod 600 ~/.ssh/dev.pem

      - name: Add server to known_hosts
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
        run: |
          PORT="${DEV_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEV_HOST" >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps
          else
            npm install
          fi

      - name: Build on CI runner
        run: npm run build

      - name: Create standalone deploy archive
        run: |
          ARCHIVE_NAME="next-build.tar.gz"
          ARCHIVE_ITEMS=(
            ".next/standalone"
            ".next/static"
          )

          [ -d ".next/standalone" ] || { echo ".next/standalone missing. Enable Next standalone output."; exit 1; }
          [ -d "public" ] && ARCHIVE_ITEMS+=("public")

          tar czf "$ARCHIVE_NAME" \
            --exclude=".next/cache" \
            "${ARCHIVE_ITEMS[@]}"

      - name: Upload archive
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          PORT="${DEV_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/dev.pem next-build.tar.gz "$DEV_USER@$DEV_HOST:/tmp/"

      - name: Deploy on server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          PORT="${DEV_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/dev.pem "$DEV_USER@$DEV_HOST" << 'EOF'
          set -euo pipefail

          REMOTE_DIR="/var/www/beige-web-front-dev"
          ARCHIVE_NAME="next-build.tar.gz"
          APP_NAME="beige-web-dev"

          mkdir -p "$REMOTE_DIR"
          find "$REMOTE_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar xzf "/tmp/$ARCHIVE_NAME" -C "$REMOTE_DIR"

          mkdir -p "$REMOTE_DIR/.next/standalone/.next"
          cp -r "$REMOTE_DIR/.next/static" "$REMOTE_DIR/.next/standalone/.next/"
          if [ -d "$REMOTE_DIR/public" ]; then
            cp -r "$REMOTE_DIR/public" "$REMOTE_DIR/.next/standalone/"
          fi

          cd "$REMOTE_DIR/.next/standalone"
          pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
          NODE_ENV=production pm2 start server.js --name "$APP_NAME"
          pm2 save

          rm -f "/tmp/$ARCHIVE_NAME"
          EOF
